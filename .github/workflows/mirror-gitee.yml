name: Mirror to Gitee

# 代码自动镜像：GitHub 推送 main 或版本标签后，同步到 Gitee 镜像仓库。
# Release 附件由 sync-gitee-releases.yml 在发布完成后统一同步。

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: gitee-code-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main and tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER || 'cuckoo711' }}
          GITEE_REPO: ${{ vars.GITEE_REPO || 'mijiaAPI' }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 Secret GITEE_TOKEN，无法镜像代码到 Gitee。请在仓库 Secret 配置具备 projects 权限的 Gitee 私人令牌。"
            exit 1
          fi

          # Git HTTP 凭据仅放在进程环境，不写入 .git/config 或 remote URL。
          auth=$(printf 'cuckoo711:%s' "$GITEE_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://gitee.com/.extraheader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          target="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"

          # 标签事件的 HEAD 指向版本提交；始终从源仓库的 main 同步主分支。
          git fetch origin main
          echo "Mirroring main to gitee/${GITEE_OWNER}/${GITEE_REPO} ..."
          git push "$target" "refs/remotes/origin/main:refs/heads/main"

          echo "Mirroring tags ..."
          git push "$target" --tags

          echo "Gitee mirror updated."
