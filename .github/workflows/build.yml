name: Build Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -e .

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Create application icon
        run: python create_icon.py

      - name: Build executable
        run: pyinstaller --clean --noconfirm mijia-server.spec

      - name: Rename executable (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          cd dist
          mv mijia-server mijia-server-${{ matrix.platform }}-${{ matrix.arch }}
          chmod +x mijia-server-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Rename executable (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd dist
          Rename-Item -Path "mijia-server.exe" -NewName "mijia-server-${{ matrix.platform }}-${{ matrix.arch }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mijia-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/mijia-server-*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -e
          # tag 形如 refs/tags/v3.2.2，剥掉前缀
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Extracting release notes for $TAG_NAME"
          BODY_FILE="$RUNNER_TEMP/release_notes.md"
          python scripts/extract_release_notes.py "$TAG_NAME" --allow-missing > "$BODY_FILE"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"
          echo "----- release notes preview -----"
          cat "$BODY_FILE"
          echo "----- end -----"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          # body_path 提供的 CHANGELOG 摘要会被放到自动生成的 issue/PR 列表前面
          body_path: ${{ steps.notes.outputs.body_file }}
          generate_release_notes: true
