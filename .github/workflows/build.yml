name: Build Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-android-test.*'
  workflow_dispatch:

jobs:
  android:
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    secrets: inherit

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          # PyInstaller 无法交叉编译，只会为宿主架构产出二进制。arm64 必须跑在
          # arm64 运行器上，否则产物是 x64 却被标成 arm64。
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: x64
          # macos-latest 是 Apple Silicon（arm64）。最后一个标准 Intel 运行器
          # macos-13 已于 2025-12 停止支持，标准运行器已无 x64 macOS，因此不再
          # 产出 macos-x64；需要恢复得改用付费的 macos-*-large 运行器。
          - os: macos-latest
            platform: macos
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -e .

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Create application icon
        run: python deploy/packaging/create_icon.py

      - name: Build executable
        run: pyinstaller --clean --noconfirm deploy/packaging/mijia-server.spec

      - name: Smoke-test frozen executable in an isolated directory
        id: smoke
        shell: bash
        run: |
          set -e
          EXPECTED_VERSION="$(python -c 'import mijiaAPI_V2; print(mijiaAPI_V2.__version__)')"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/v}" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Release tag does not match the bundled application version"
            exit 1
          fi
          EXECUTABLE="dist/mijia-server"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            EXECUTABLE="${EXECUTABLE}.exe"
          fi
          python deploy/packaging/smoke.py \
            --executable "$EXECUTABLE" \
            --expected-version "$EXPECTED_VERSION" \
            --report "dist/smoke-${{ matrix.platform }}-${{ matrix.arch }}.json"

      - name: Upload frozen executable smoke report
        if: always() && steps.smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: frozen-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/smoke-${{ matrix.platform }}-${{ matrix.arch }}.json
          if-no-files-found: error

      # 防止「标签与实际架构不符」再次悄悄发布：v3.8.0 曾把 x64 产物标成
      # linux-arm64、把 arm64 产物标成 macos-x64，构建全绿也没发现。
      - name: Verify binary architecture (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          set -e
          DESCRIPTION="$(file dist/mijia-server)"
          echo "$DESCRIPTION"
          case "${{ matrix.arch }}" in
            x64)   EXPECTED='x86-64|x86_64' ;;
            arm64) EXPECTED='aarch64|arm64' ;;
            *)     echo "::error::未知的 matrix.arch: ${{ matrix.arch }}"; exit 1 ;;
          esac
          if ! printf '%s' "$DESCRIPTION" | grep -Eq "$EXPECTED"; then
            echo "::error::架构不符，期望 ${{ matrix.arch }}，实际: $DESCRIPTION"
            exit 1
          fi

      - name: Rename executable (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          cd dist
          mv mijia-server mijia-server-${{ matrix.platform }}-${{ matrix.arch }}
          chmod +x mijia-server-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Rename executable (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd dist
          Rename-Item -Path "mijia-server.exe" -NewName "mijia-server-${{ matrix.platform }}-${{ matrix.arch }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mijia-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/mijia-server-*

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mijia-server-*
          merge-multiple: true
          path: artifacts

      - name: Verify complete release and generate download checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          directory = Path("artifacts")
          expected = {
              "mijia-server-linux-x64",
              "mijia-server-linux-arm64",
              "mijia-server-windows-x64.exe",
              "mijia-server-macos-arm64",
          }
          files = {path.name for path in directory.iterdir() if path.is_file()}
          if files != expected:
              raise SystemExit(f"Incomplete release assets: missing={sorted(expected - files)}, unexpected={sorted(files - expected)}")
          lines = []
          for name in sorted(expected):
              path = directory / name
              if path.stat().st_size == 0:
                  raise SystemExit(f"Empty release executable: {name}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}\n")
          (directory / "SHA256SUMS").write_text("".join(lines), encoding="utf-8")
          print("Verified all four executables; generated SHA256SUMS")
          PY

      - name: Download verified Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-artifacts

      - name: Verify Android download checksums
        working-directory: android-artifacts
        run: sha256sum --check ANDROID_SHA256SUMS

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -e
          # tag 形如 refs/tags/v3.2.2，剥掉前缀
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Extracting release notes for $TAG_NAME"
          BODY_FILE="$RUNNER_TEMP/release_notes.md"
          python deploy/scripts/extract_release_notes.py "$TAG_NAME" --allow-missing > "$BODY_FILE"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"
          echo "----- release notes preview -----"
          cat "$BODY_FILE"
          echo "----- end -----"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mijia-server-*
            artifacts/SHA256SUMS
            android-artifacts/*
          # body_path 提供的 CHANGELOG 摘要会被放到自动生成的 issue/PR 列表前面
          body_path: ${{ steps.notes.outputs.body_file }}
          generate_release_notes: true

      # Gitee 仓库名与 GitHub 不同（cuckoo711/mijiaAPI）。令牌放 Secret GITEE_TOKEN。
      - name: Mirror release assets to Gitee
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER || 'cuckoo711' }}
          GITEE_REPO: ${{ vars.GITEE_REPO || 'mijiaAPI' }}
          GITEE_UPLOAD_TRANSPORT: curl
          GITEE_UPLOAD_MAX_SECONDS: '7200'
        run: |
          set -e
          python deploy/scripts/sync_gitee_releases.py \
            --github-repo "$GITHUB_REPOSITORY" \
            --tag "${GITHUB_REF#refs/tags/}" \
            --owner "$GITEE_OWNER" \
            --repo "$GITEE_REPO"
