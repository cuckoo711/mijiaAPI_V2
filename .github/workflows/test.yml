name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit tests/docker -q --tb=short

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Verify admin flows and frontend types
        working-directory: web
        run: |
          npm test
          npm run typecheck

  docker:
    name: Docker runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Build Docker image
        run: docker build --file deploy/Dockerfile --tag mijia-server:ci .

      - name: Verify Docker runtime lifecycle
        run: python tests/docker/smoke.py --image mijia-server:ci --report docker-smoke-report.json

      - name: Upload Docker runtime verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-runtime-report
          path: docker-smoke-report.json
          if-no-files-found: ignore
