name: Sync latest releases to Gitee

on:
  workflow_run:
    workflows: ['Build Multi-Platform Release', 'Android Test APK']
    types: [completed]
  release:
    types: [published, edited]
  schedule:
    # Asia/Shanghai 03:37: recover missed events and incomplete transfers.
    - cron: '37 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅检查最新正式版与最新 Android 测试版，不写入 Gitee'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gitee-release-sync
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      has_releases: ${{ steps.plan.outputs.has_releases }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate event and select latest releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python deploy/scripts/gitee_release_policy.py --github-repo "$GITHUB_REPOSITORY"

  sync:
    name: Sync ${{ matrix.tag }}
    needs: plan
    if: needs.plan.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Copy existing release metadata and verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER || 'cuckoo711' }}
          GITEE_REPO: ${{ vars.GITEE_REPO || 'mijiaAPI' }}
          SYNC_TAG: ${{ matrix.tag }}
          SYNC_DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          GITEE_UPLOAD_TRANSPORT: curl
          GITEE_UPLOAD_MAX_SECONDS: '7200'
        run: |
          set -euo pipefail
          args=(--github-repo "$GITHUB_REPOSITORY" --owner "$GITEE_OWNER" --repo "$GITEE_REPO" --tag "$SYNC_TAG" --latest-only --report "$RUNNER_TEMP/gitee-release-sync.json")
          if [ "$SYNC_DRY_RUN" = true ]; then
            args+=(--dry-run)
          else
            if [ -z "$GITEE_TOKEN" ]; then
              echo "::error::缺少仓库 Secret GITEE_TOKEN（需 projects 权限）。"
              exit 1
            fi
            # Token and its encoded form stay out of Git URLs and disk config.
            auth=$(printf 'cuckoo711:%s' "$GITEE_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=http.https://gitee.com/.extraheader
            export GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          fi
          target="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          ref="refs/tags/${SYNC_TAG}"
          sync_once() {
            if [ "$SYNC_DRY_RUN" != true ]; then
              git fetch --no-tags origin "$ref:$ref" || return 1
              git push "$target" "$ref:$ref" || return 1
            fi
            python -u deploy/scripts/sync_gitee_releases.py "${args[@]}"
          }
          # Retry from a fresh inventory, never blindly repeat a multipart POST.
          for attempt in 1 2 3; do
            if sync_once; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "Synchronization attempt $attempt failed; retrying after 30 seconds."
            sleep 30
          done

      - name: Save per-release synchronization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitee-release-sync-${{ matrix.release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitee-release-sync.json
          if-no-files-found: ignore
          retention-days: 14
