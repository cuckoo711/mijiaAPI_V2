plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def backendVersion = (new File(rootDir.parentFile, 'pyproject.toml').text =~ /(?m)^version = "([^"]+)"/)[0][1]
def apkVersion = project.findProperty('androidVersion') ?: "${backendVersion}-android-test.${project.findProperty('androidTestRevision') ?: '1'}"
def parts = backendVersion.tokenize('.').collect { it.toInteger() }
def testRevision = (apkVersion =~ /-android-test\.(\d+)$/)
def revision = testRevision.find() ? testRevision.group(1).toInteger() : 99
if (!(apkVersion == backendVersion || apkVersion ==~ /${java.util.regex.Pattern.quote(backendVersion)}-android-test\.\d+/) || revision < 1 || revision > 99) {
    throw new GradleException('Android version must match backend version; test revision must be 1..99')
}

android {
    namespace 'com.cuckoo.mijia.standalone'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cuckoo.mijia.standalone'
        minSdk 24
        targetSdk 35
        versionCode parts[0] * 1000000 + parts[1] * 10000 + parts[2] * 100 + revision
        versionName apkVersion
    }
    signingConfigs {
        debug {
            if (System.getenv('ANDROID_TEST_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_TEST_KEYSTORE_PATH'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    flavorDimensions 'architecture'
    productFlavors {
        universal { dimension 'architecture'; ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' } }
        arm32 { dimension 'architecture'; ndk { abiFilters 'armeabi-v7a' } }
        arm64 { dimension 'architecture'; ndk { abiFilters 'arm64-v8a' } }
        x86 { dimension 'architecture'; ndk { abiFilters 'x86' } }
        x64 { dimension 'architecture'; ndk { abiFilters 'x86_64' } }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        if (project.hasProperty('buildPython')) buildPython project.property('buildPython')
        extractPackages 'mijia_android', 'Crypto'
        pip {
            options '--no-index'
            options '--find-links', rootProject.file('wheels/dist').absolutePath
            install '-r', rootProject.file('requirements.txt').absolutePath
        }
    }
    sourceSets {
        main { srcDir layout.buildDirectory.dir('generated/python').get().asFile }
    }
}
