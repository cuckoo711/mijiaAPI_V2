plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.cuckoo.mijia.standalone'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cuckoo.mijia.standalone'
        minSdk 24
        targetSdk 35
        versionCode 3090101
        versionName '3.9.1-android-test.1'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        if (project.hasProperty('buildPython')) buildPython project.property('buildPython')
        extractPackages 'mijia_android', 'Crypto'
        pip {
            options '--find-links', rootProject.file('wheels/dist').absolutePath
            install '-r', rootProject.file('requirements.txt').absolutePath
        }
    }
    sourceSets {
        main { srcDir layout.buildDirectory.dir('generated/python').get().asFile }
    }
}
